name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, development]

jobs:
  test-server:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Security audit
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

  lint-client:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: expense-tracker-web/package-lock.json

      - name: Install dependencies
        working-directory: expense-tracker-web
        run: npm ci

      - name: Run lint
        working-directory: expense-tracker-web
        run: npm run lint

      - name: Build check
        working-directory: expense-tracker-web
        run: npm run build

      - name: Security audit
        working-directory: expense-tracker-web
        run: npm audit --audit-level=high
        continue-on-error: true

